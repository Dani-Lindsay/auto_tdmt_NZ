# auto_tdmt_NZ — automated regional moment tensor pipeline for New Zealand
#
# Fresh machine bootstrap:
#   curl -fsSL https://pixi.sh/install.sh | bash   # if pixi missing
#   pixi install
#   pixi run test
# CPS (Green's function build, LOCAL ONLY, not needed in CI):
#   brew install gcc   # gfortran
#   see greens.py --help
[workspace]
authors = ["dani-lindsay <danielle.lindsay@earthsciences.nz>"]
channels = ["conda-forge"]
name = "auto_tdmt_NZ"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
# launchers (src/<name>.py --help for options); the science is in the task modules
watch = "python src/watch.py"                  # cron entry: poll, process, email
process = "python src/process_event.py"        # one event, tasks 1-5:  --event <publicID>
publish = "python src/publish_event.py"        # email one processed event
backsweep = "python src/backsweep.py"          # process a date range, never emails
validate = "python src/validate.py"            # archive vs Ristau / GCMT catalogues
sync = "python src/sync_repo.py"               # local archive -> repo, tables, validate, commit
replay-labels = "python src/replay_labels.py"  # station-selection acceptance test
test = "pytest -q"
# one-command Green's function download for students (extracts gf_cache/):
get-gfs = """test -d gf_cache && echo 'gf_cache already present' || \
(curl -L https://github.com/Dani-Lindsay/auto_tdmt_NZ/releases/download/gf-latest/gf_library.tar.zst \
 | tar --use-compress-program=unzstd -xf - -C . && ls gf_cache)"""
review = "jupyter notebook human_review.ipynb"
# rebuild the per-task walkthrough notebooks (docs/task_*.ipynb); --execute runs them
notebooks = "python tools/build_task_notebooks.py"
params = "python src/params.py"

[dependencies]
python = "3.12.*"
numpy = ">=2"
# pandas<3: mttime 1.1.0 issue #15 (read-only .values view crashes correlate)
pandas = ">=2.2,<3"
obspy = ">=1.5"
pygmt = "*"
cartopy = "*"
cmcrameri = "*"
matplotlib = "*"
requests = "*"
pytest = ">=8"
pip = "*"
# compilers so pypi source builds (okada4py meson) work identically on
# osx-arm64 and linux-64 without relying on system toolchains
c-compiler = "*"
meson-python = "*"
ipykernel = ">=7.3.0,<8"
notebook = ">=7.6.2,<8"
ipywidgets = ">=8.1.9,<9"
zstd = ">=1.5.7,<2"

[pypi-dependencies]
mttime = { git = "https://github.com/LLNL/mttime.git" }
okada4py = { git = "https://github.com/jolivetr/okada4py.git" }
atproto = "*"
asf-search = "*"
