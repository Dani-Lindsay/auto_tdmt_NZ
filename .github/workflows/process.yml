name: process-event
# Manually (re)process one event by publicID, with optional debug figures.
# Does NOT email; use the publish workflow for that.

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: "GeoNet publicID (e.g. 2026p660242)"
        required: true
      debug:
        description: "save stage-by-stage troubleshooting figures"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      AUTO_TDMT_OUTPUT: ${{ github.workspace }}/outputs_ci
      AUTO_TDMT_EVENTS: ${{ github.workspace }}/events
      AUTO_TDMT_GF: ${{ github.workspace }}/gf_cache
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.11
        with:
          cache: true

      - name: Restore Green's function libraries
        id: gf
        uses: actions/cache@v4
        with:
          path: gf_cache
          key: gf-${{ hashFiles('models/*.d', 'config.py') }}-v1

      - name: Fetch GF libraries from release
        if: steps.gf.outputs.cache-hit != 'true'
        run: |
          gh release download gf-latest --pattern 'gf_library.tar.zst' --output - \
            | tar --zstd -xf - -C .
          test -d gf_cache
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Process
        run: |
          pixi run python run02_process.py --event "${{ inputs.event_id }}" \
            ${{ inputs.debug && '--debug' || '' }}

      - name: Commit results
        run: |
          git config user.name "auto-tdmt-bot"
          git config user.email "actions@github.com"
          git add events/
          git diff --cached --quiet && exit 0
          git commit -m "auto: reprocess ${{ inputs.event_id }}"
          git pull --rebase origin ${{ github.ref_name }}
          git push
