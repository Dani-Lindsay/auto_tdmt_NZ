name: watch-geonet
# Poll GeoNet twice an hour; process every new event above the floor
# and email solutions that pass the publication gates. Results + state
# are committed back to the repo (public archive).
#
# This is not a real-time tool. GitHub runs "schedule" triggers on a
# shared low-priority queue, so the cron is an upper bound on attempts,
# not a guarantee: measured on this repo, a */10 cron fired at a median
# gap of 214 minutes (2026-09-05, 15 intervals), and two fixed daily
# slots fired about once a day, ~5 hours late. Expect a new event to be
# picked up within one to a few hours. Each attempt that finds nothing
# new costs under a minute (public repo: runner minutes are free) and
# the state file dedupes, so polling never repeats work.
# workflow_dispatch skips the queue entirely for anything urgent.
#
# Busy days: the watcher processes the LARGEST events first and stops
# starting new ones after --budget-minutes, leaving the rest for the
# next run (the state file dedupes, so nothing is lost or repeated).
# A 25-event aftershock day therefore fits: ~20 events get processed,
# the remainder go out the next day, and the daily email cap plus the
# aftershock throttle keep the list quiet either way.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # outputs go into the checkout so they can be committed
      AUTO_TDMT_OUTPUT: ${{ github.workspace }}/outputs_ci
      AUTO_TDMT_EVENTS: ${{ github.workspace }}/events
      AUTO_TDMT_GF: ${{ github.workspace }}/gf_cache
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.11
        with:
          cache: true

      - name: Restore Green's function libraries
        id: gf
        uses: actions/cache@v4
        with:
          path: gf_cache
          key: gf-${{ hashFiles('models/*.d', 'src/config.py') }}-v1

      - name: Fetch GF libraries from release
        if: steps.gf.outputs.cache-hit != 'true'
        run: |
          gh release download gf-latest --pattern 'gf_library.tar.zst' --output - \
            | tar --zstd -xf - -C .
          test -d gf_cache
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Poll and process
        run: pixi run python src/watch.py --process --budget-minutes 300

      - name: Commit results
        run: |
          git config user.name "auto-tdmt-bot"
          git config user.email "actions@github.com"
          # the tables and overview map are build products of events/:
          # never merged as files — dropped, rebased, rebuilt from the union
          PRODUCTS="catalogue.csv not_published.csv station_ledger.jsonl station_performance.csv events/solutions_map.jpg events/latest_stations_displacement_field.jpg"
          git add events/ ':!events/solutions_map.jpg' ':!events/latest_stations_displacement_field.jpg'
          git diff --cached --quiet && exit 0
          git commit -m "auto: solutions $(date -u +%Y-%m-%dT%H:%MZ)"
          git checkout -- $PRODUCTS
          git pull --rebase origin ${{ github.ref_name }}
          pixi run tables
          git add $PRODUCTS
          git diff --cached --quiet || git commit -m "auto: tables rebuilt"
          git push
