# vim: set filetype=cfg:
##------------------------ auto_tdmt.cfg ------------------------------##
## Every tunable in the pipeline, in one place, MintPy style.
##
## "auto" takes the default written in the trailing comment. Change a
## value here and every solution produced afterwards records it in
## solution.json -> provenance.params, so a catalogue row can always be
## traced to the exact numbers that made it.
##
## Each parameter cites where its default comes from. The literature
## review behind these choices is docs/lit_review/ ; the method write-up
## is docs/METHOD.md. Infrastructure that is not a scientific choice
## (paths, URLs, the precomputed Green's-function grid, channel codes)
## lives in config.py, not here.
##
## Five tasks:  1 geonet  ->  2 stations  ->  3 invert  ->  4 forward  ->  5 publish


########## 1. GeoNet search (task 1: which events are attempted)
## The preliminary magnitude is reported as M, MLv or mB and, for small
## events, is typically ~0.2-0.3 above the final Mw, so the floor is set
## low: everything above it is processed and archived; publication is
## decided later on the Mw from this inversion. Herrmann, Benz & Ammon
## (2011, BSSA 101) routinely reach Mw 3.7 in the same 0.02-0.10 Hz band
## on a comparable network. Depths reported as 5, 12 or 33 km are fixed
## default values rather than fitted depths: those events are always
## attempted and the depth search decides.
auto_tdmt.geonet.minPrelimMag     = auto    # [3.0-6.0] auto for 3.7 (Herrmann, Benz & Ammon 2011)
auto_tdmt.geonet.maxDepthKm       = auto    # [20-100] auto for 50 (2026p530771 Fiordland was missed at 30)
auto_tdmt.geonet.placeholderDepthsKm = auto # auto for 5 12 33 (GeoNet fixed depths, exempt from maxDepthKm)
auto_tdmt.geonet.bbox             = auto    # latMin latMax lonMin lonMax; auto for -50.5 -33.0 164.0 182.5


########## 2. Station selection and waveform processing (task 2)
## Distances: the search radius grows with magnitude because small events
## attenuate below usefulness at far field (Gisola uses 10-250 km for
## M4-5 and 40-300 km for M5-5.5; Triantafyllis et al. 2022). The near
## limit drops to 10 km for small events, whose information lives in the
## close stations (an M4 rupture is ~1 km, so the point source holds).
auto_tdmt.station.minDistKm       = auto    # auto for 20 (10 below M4.5)
auto_tdmt.station.maxDistKm       = auto    # auto for 120 180 250 300 at M<4 <4.5 <5 >=5 (Gisola)
auto_tdmt.station.maxStations     = auto    # cap on the inverted set; auto for 16 (Gisola: 8 sectors x 2)
auto_tdmt.station.sectors         = auto    # azimuth sectors used to ORDER candidates; auto for 8 (INGV, Gisola, scisola)
## Signal quality: per-component SNR = RMS(signal window after P) /
## RMS(same length before P), measured after filtering, where the signal
## window is the one that will be inverted (BMKG use a fixed 200 s for
## their M >= 5 events; on an M3.7 that dilutes a 60 s train to noise).
## The station is usable when its BEST component clears the threshold:
## a component on a nodal plane leaves the others informative, and the
## fit (task 3) decides the rest (Halauwet et al. 2024, GJI 239, screen
## per component for the same reason). Every published system that defines an SNR uses 2-5; 1.2 was
## "signal 20% above noise", which no operational system accepts.
auto_tdmt.station.snrMin          = auto    # [1.5-5] auto for 2.0 (Halauwet et al. 2024; AutoBATS uses 2.0, INGV 5)
auto_tdmt.station.snrWindowS      = auto    # CAP on the SNR window; the window is the inverted one (P to dist/groupVel + tail); auto for 200 (Halauwet et al. 2024)
## Amplitude consistency: peak x distance should be comparable across the
## network; a station far ABOVE the median most likely has inconsistent
## response metadata (one station in 2026 at ~100x). W-phase screens
## 0.1x-3x on BOTH sides
## (Duputel et al. 2012, GJI 189); the low side is deliberately skipped
## here because a station near a nodal plane genuinely has small
## amplitude and that is information about the mechanism (D. Lindsay
## 2026-09-04; Duputel et al. name exactly this failure mode).
auto_tdmt.station.amplitudeMaxRatio = auto  # [2-10] auto for 3 (Duputel et al. 2012)
## Filter bands by magnitude, an ORDERED preference: the first band whose
## solution passes its gate wins, because VR is not comparable across
## bands (a longer period is smoother and scores higher even when it fits
## noise). Near-identical to SCSN's menu (Clinton, Hauksson & Solanki
## 2006, BSSA 96: ML<4.2 10-50 s, 4.2-5.5 20-50 s, >5.5 20-100 s) and to
## INGV's rule of pushing small events to HIGHER frequencies.
auto_tdmt.station.magBreaks       = auto    # auto for 4.5 5.5 (small | medium | large)
auto_tdmt.station.periodsSmallS   = auto    # auto for 10 50 (Clinton et al. 2006)
auto_tdmt.station.periodsMediumS  = auto    # auto for 10 50, 20 50 (10-50 s first, 20-50 s fallback)
auto_tdmt.station.periodsLargeS   = auto    # auto for 20 100, 30 100 (20-100 s first; 30-100 s looked over-smoothed)
auto_tdmt.station.filterCorners   = auto    # Butterworth corners, zero-phase; auto for 3 (mttime notebook 02)
## Record window per station: 30 s before origin to dist/groupVel + tail
## after it, extended to where the smoothed envelope decays back toward
## the pre-event level (slow Hikurangi paths), capped at maxWindowS.
## SLU/Herrmann cut dist/3.3 km/s +/- 40 s; 2.5 km/s here keeps the
## whole train for NZ paths (2026p091845 review).
auto_tdmt.station.groupVelKms     = auto    # auto for 2.5
auto_tdmt.station.windowTailS     = auto    # auto for 30 40 60 at small | medium | large
auto_tdmt.station.windowMinS      = auto    # auto for 60
auto_tdmt.station.maxWindowS      = auto    # after origin; auto for 200 (was 120: cut 300 km stations mid-train)
auto_tdmt.station.windowExtendMaxS= auto    # envelope extension beyond the kinematic end; auto for 60 (slow paths add tens of s, not 150)


########## 3. Inversion (task 3: mttime, Chiang / LLNL; method Dreger & Helmberger 1993)
## Depth: the search is BOUNDED around the GeoNet hypocentre, never forced
## to it. Every operational system reviewed bounds it (F-net JMA +/-30 km,
## Gisola +/-31 km, W-phase and SCARDEC +/-50 km, AutoBATS +/-12 km); an
## unbounded grid let VR climb monotonically into the smoothest Green's
## functions (2026p666955: 50 km against a 26 km hypocentre). Placeholder
## GeoNet depths get the full library. The preferred depth is the maximum
## VR - mttime's own rule and everyone else's - and the reported depth
## uncertainty is the range of depths whose VR is within depthUncPct of
## the maximum (SCARDEC, Vallee et al. 2011; Bernardi et al. 2004).
auto_tdmt.invert.depthWindowKm    = auto    # [10-60] auto for 30 (F-net; Gisola)
auto_tdmt.invert.depthUncPct      = auto    # auto for 10 (Vallee et al. 2011; Bernardi et al. 2004)
## mttime controls (see mttime/core/configure.py): degree 5 solves the
## deviatoric tensor (DC + CLVD), 6 adds the isotropic part (rarely
## resolvable at regional distances; ISO and CLVD trade off at shallow
## depth - Cesca & Heimann 2018). weight = distance up-weights far
## stations (F-net's published VR definition); variance normalises by
## data power (amplitude equalisation, NOT noise weighting); none is
## plain least squares. correlate = 1 lets each station shift in time to
## absorb velocity-model error.
auto_tdmt.invert.degree           = auto    # 5 | 6 ; auto for 5 (deviatoric)
auto_tdmt.invert.weight           = auto    # none | distance | variance ; auto for distance (F-net)
auto_tdmt.invert.components       = auto    # auto for ZRT
auto_tdmt.invert.correlate        = auto    # 0 | 1 ; auto for 1
## Station selection by fit - the loop of Clinton, Hauksson & Solanki
## (2006): invert everyone, drop any station whose own VR is below
## stationVRFloor or whose solved time shift exceeds maxTimeShiftS,
## re-invert; repeat until nothing drops or minStations remain. Poor
## fits leave at most maxDropPerRound per round (backward elimination:
## the reference solution improves before marginal stations are judged);
## chance alignments all leave at once. The floor is FIXED (gempa's minimumFinalStationFit = 0.3; Clinton's
## quality-B rule 25). Clinton et al. also drop below (overall VR -
## stationVRDrop) but then reselect stations to refill the sectors;
## without that refill the relative rule ratchets a 16-station event to
## 3 stations, so it is OFF (0) by default. mttime's shift search is
## UNBOUNDED, so the cap is what stops a noise trace sliding into a
## chance alignment (NEIC SynDepth clips at 6/8/10 s; AutoBATS +/-2 s).
auto_tdmt.invert.stationVRFloor   = auto    # [20-40] auto for 25 (Clinton et al. 2006 B rule; gempa 30)
auto_tdmt.invert.stationVRDrop    = auto    # auto for 0 = off; Clinton et al. 2006 use 10 WITH sector refilling
auto_tdmt.invert.maxTimeShiftS    = auto    # [2-10] auto for 8 (NEIC SynDepth)
auto_tdmt.invert.maxRounds        = auto    # auto for 8 (stops early when nothing drops)
auto_tdmt.invert.maxDropPerRound  = auto    # poor-fit drops per round, worst first (shift offenders all go); auto for 3
auto_tdmt.invert.minStations      = auto    # auto for 3 (below this: no coherent solution)
## Jackknife: leave-one-station-out at the preferred depth; the largest
## mechanism rotation (Townend et al. 2012 minimum rotation angle) is the
## stability evidence. NIED state in print it is the only reliable way to
## detect a station gone bad (Fukuyama et al. 1998).
auto_tdmt.invert.jackknife        = auto    # 0 | 1 ; auto for 1
## Grade: INGV's table, where the VR bar FALLS as station count rises so a
## solution cannot buy a better grade by dropping stations (scisola:
## 10 stations VR 0.7 -> 2 stations VR 0.9 with a condition number > 10).
## A and B additionally require DC >= dcMinPublish (the BSL publishability
## rule; INGV's "a" suffix) and jackknife rotation <= jackknifeMaxDeg.
## Rows are N stations: 3 | 4 | 5-8 | >8 ; columns are the VR needed.
auto_tdmt.invert.gradeA_VR        = auto    # auto for 999 60 60 50 (unreachable with 3 stations)
auto_tdmt.invert.gradeB_VR        = auto    # auto for 70 40 40 30
auto_tdmt.invert.gradeC_VR        = auto    # auto for 20 20 15 15
auto_tdmt.invert.dcMinPublish     = auto    # auto for 60 (BSL; INGV suffix a)
auto_tdmt.invert.jackknifeMaxDeg  = auto    # auto for 25


########## 4. Forward model (task 4: Okada 1992 via okada4py)
## Rectangular uniform-slip dislocation for EACH nodal plane (the MT
## cannot tell them apart). Fault length and width from Wells &
## Coppersmith (1994, BSSA 84) "all slip types" regressions:
##   log10(L km) = -2.44 + 0.59 Mw ,  log10(W km) = -1.01 + 0.32 Mw
## Slip from M0 = mu L W s. Grid halfwidth scales with the source
## (8 x length, clipped) so the lobes fill the figure at any magnitude.
auto_tdmt.forward.shearModulusPa  = auto    # auto for 30e9
auto_tdmt.forward.poissonRatio    = auto    # auto for 0.25 (okada4py default)
auto_tdmt.forward.wcLength        = auto    # log10 L = a + b Mw ; auto for -2.44 0.59 (Wells & Coppersmith 1994)
auto_tdmt.forward.wcWidth         = auto    # log10 W = a + b Mw ; auto for -1.01 0.32
auto_tdmt.forward.gridHalfwidthKm = auto    # auto = 8 x length clipped 20-200 ; or a number
auto_tdmt.forward.gridPoints      = auto    # per side; auto for 120


########## 5. Publish / archive (task 5)
## Everything processed is archived (events/, catalogue.csv, and every
## non-published event with its reason in events/not_published.csv).
## The email goes out only for grade A/B AND (our Mw >= minMw OR the
## Okada-predicted peak displacement >= minDisplacementM - the InSAR-
## interesting case). Anti-spam: a daily cap, and an aftershock throttle
## (within aftershockRadiusKm and aftershockWindowDays of a published
## event, a smaller event must be within aftershockMwMargin of it).
auto_tdmt.publish.minGrade        = auto    # A | B ; auto for B
auto_tdmt.publish.minMw           = auto    # auto for 5.0
auto_tdmt.publish.minDisplacementM= auto    # auto for 0.01 (1 cm)
auto_tdmt.publish.maxPerDay       = auto    # auto for 3
auto_tdmt.publish.aftershockRadiusKm  = auto  # auto for 75
auto_tdmt.publish.aftershockWindowDays= auto  # auto for 14
auto_tdmt.publish.aftershockMwMargin  = auto  # auto for 0.5


########## Green's functions (PRECOMPUTED - shown for completeness only)
## The library is built once by greens.py --build with Computer Programs in
## Seismology (Herrmann 2013, SRL 84) and attached to the gf-latest release.
## Changing any of these means rebuilding and re-uploading the library, so
## they are read from config.py, not from here. Listed so that every number
## that shaped a solution is visible in one file.
##   velocity models   : models/nz_north_ristau2008.d, models/nz_south_ristau2008.d
##                       (Ristau 2008, SRL 79(3) Table 1 - the velocity models
##                        published for NZ regional CMT analysis, so solutions
##                        can be compared with that catalogue)
##   north/south split : latitude <= -40.5 and longitude < 175 -> south
##   distance grid     : 10-500 km at 5 km (nearest grid point used)
##   depth grid        : 1-5 km at 0.5, 6-10 at 1, 12-30 at 2, 34-58 at 4 (31 depths)
##   sample interval   : 1.0 s ; npts 256 ; vred 0 ; t0 0 (traces start at origin)
##   sources           : 10 Herrmann fundamental Green's functions (ZSS ZDS ZDD
##                       RSS RDS RDD TSS TDS ZEX REX), hspec96 / hpulse96
##   response removal  : pre-filter 0.004 0.007 10 20 Hz -> displacement (m)
##   data window       : origin-30 s .. origin+200 s, decimated to 1 sps, cm
